_format_version: "3.0"
services:
- name: accounts
  protocol: http
  host: accounts-service
  port: 8081
  routes:
  - name: accounts
    paths:
    - /accounts
    protocols:
    - http
- name: transactions
  protocol: http
  host: transactions-service
  port: 8082
  routes:
  - name: transactions
    paths:
    - "~/transactions/(?<account_id>\\S+)$"
    protocols:
    - http
    plugins:
    - name: request-transformer-advanced
      config:
        replace:
          uri: "/accounts/$(uri_captures['account_id'])/transactions"
- name: echo
  protocol: http
  host: echo
  path: /anything
  routes:
  - name: echo
    paths:
    - /echo

routes:
- name: accounts-mcp
  paths:
  - /accounts/mcp
plugins:
- name: file-log
  config:
    path: /dev/stdout
    reopen: false
